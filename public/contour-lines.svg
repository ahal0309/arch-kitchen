<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <linearGradient id="goldContour1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.70" />
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0.50" />
    </linearGradient>
    <linearGradient id="goldContour2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.50" />
      <stop offset="60%" stop-color="#b38e45" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0.45" />
    </linearGradient>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Right Elevation Contours (Atmospheric Flow) -->
    <path d="M 800 -100 C 1050 50, 1250 150, 1700 80" stroke="url(#goldContour1)" stroke-width="1.2" />
    <path d="M 750 -100 C 1000 80, 1200 210, 1700 140" stroke="url(#goldContour1)" stroke-width="1.2" stroke-dasharray="14 8" />
    <path d="M 700 -100 C 950 120, 1150 270, 1700 200" stroke="url(#goldContour2)" stroke-width="1.3" />
    <path d="M 640 -100 C 900 160, 1100 330, 1700 260" stroke="url(#goldContour1)" stroke-width="1.1" />
    <path d="M 580 -100 C 850 200, 1050 390, 1700 320" stroke="url(#goldContour2)" stroke-width="1.4" />
    <path d="M 520 -100 C 800 240, 1000 450, 1700 380" stroke="url(#goldContour1)" stroke-width="1.2" stroke-dasharray="10 6" />
    <path d="M 460 -100 C 750 280, 950 510, 1700 440" stroke="url(#goldContour2)" stroke-width="1.2" />
    <path d="M 400 -100 C 700 320, 900 570, 1700 500" stroke="url(#goldContour1)" stroke-width="1.3" />
    <path d="M 340 -100 C 650 360, 850 630, 1700 560" stroke="url(#goldContour2)" stroke-width="1.1" />
    <path d="M 280 -100 C 600 400, 800 690, 1700 620" stroke="url(#goldContour1)" stroke-width="1.2" stroke-dasharray="18 10" />

    <!-- Center Flow Lines (Connecting top to bottom naturally) -->
    <path d="M -100 350 C 400 300, 800 600, 1700 700" stroke="url(#goldContour1)" stroke-width="1.1" />
    <path d="M -100 420 C 430 380, 850 660, 1700 760" stroke="url(#goldContour2)" stroke-width="1.3" />
    <path d="M -100 490 C 460 450, 900 720, 1700 820" stroke="url(#goldContour1)" stroke-width="1.2" stroke-dasharray="12 6" />
    <path d="M -100 560 C 500 520, 950 780, 1700 880" stroke="url(#goldContour2)" stroke-width="1.4" />
    <path d="M -100 630 C 540 600, 1000 840, 1700 940" stroke="url(#goldContour1)" stroke-width="1.2" />

    <!-- Bottom-Left Concentric Topographic Formations -->
    <path d="M -100 720 C 200 700, 450 850, 800 1300" stroke="url(#goldContour1)" stroke-width="1.3" />
    <path d="M -100 790 C 240 780, 500 910, 900 1300" stroke="url(#goldContour2)" stroke-width="1.2" stroke-dasharray="14 7" />
    <path d="M -100 860 C 280 850, 560 980, 1000 1300" stroke="url(#goldContour1)" stroke-width="1.4" />
    <path d="M -100 930 C 330 920, 620 1050, 1100 1300" stroke="url(#goldContour2)" stroke-width="1.2" />
    <path d="M -100 1000 C 380 1000, 680 1120, 1200 1300" stroke="url(#goldContour1)" stroke-width="1.3" stroke-dasharray="16 8" />
    <path d="M -100 1070 C 430 1070, 740 1190, 1300 1300" stroke="url(#goldContour2)" stroke-width="1.2" />
    <path d="M -100 1140 C 480 1140, 800 1260, 1400 1300" stroke="url(#goldContour1)" stroke-width="1.1" />

    <!-- Subtle Survey Coordinate Elevation Markers -->
    <circle cx="950" cy="510" r="2.5" fill="#c5a059" opacity="0.6" />
    <text x="962" y="514" font-family="'Space Grotesk', monospace" font-size="9" fill="#c5a059" opacity="0.6" letter-spacing="2">EL. 182.50m</text>

    <circle cx="460" cy="450" r="2.5" fill="#c5a059" opacity="0.6" />
    <text x="472" y="454" font-family="'Space Grotesk', monospace" font-size="9" fill="#c5a059" opacity="0.6" letter-spacing="2">CONTOUR SEC 04</text>

    <circle cx="330" cy="920" r="2.5" fill="#c5a059" opacity="0.6" />
    <text x="342" y="924" font-family="'Space Grotesk', monospace" font-size="9" fill="#c5a059" opacity="0.6" letter-spacing="2">DATUM TORONTO</text>
  </g>
</svg>
