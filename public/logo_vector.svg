<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="100%" height="100%">
  <defs>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc58a" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#9d7936" />
    </linearGradient>
  </defs>

  <!-- Left Monogram Icon / Emblem -->
  <g transform="translate(10, 15) scale(0.65)">
    <!-- A Upper -->
    <polygon points="50,15 90,15 125,75 85,75" fill="url(#brassGrad)" />
    <!-- A Lower Arch Base -->
    <polygon points="10,135 45,75 130,75 165,135 125,135 105,100 70,100 50,135" fill="url(#brassGrad)" />
    
    <!-- Central Divider Axis -->
    <line x1="150" y1="5" x2="150" y2="215" stroke="url(#brassGrad)" stroke-width="2.5" />
    
    <!-- K Stem -->
    <rect x="180" y="25" width="28" height="50" fill="url(#brassGrad)" />
    <rect x="180" y="100" width="28" height="85" fill="url(#brassGrad)" />
    <!-- K Upper Diagonal -->
    <polygon points="225,80 280,25 315,25 260,80" fill="url(#brassGrad)" />
    <!-- K Lower Diagonal -->
    <polygon points="235,95 285,185 325,185 275,95" fill="url(#brassGrad)" />
  </g>

  <!-- High-Readability Brand Typography in Vector Form -->
  <g transform="translate(235, 78)">
    <text font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="44" font-weight="700" letter-spacing="8" fill="#1e1d1b">ARCH</text>
    <text x="175" font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="44" font-weight="700" letter-spacing="8" fill="#c5a059">KITCHENS</text>
    
    <!-- Subtitle / Tagline -->
    <text y="42" x="4" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="9" fill="#78756e">DESIGN YOUR DESIRE</text>
  </g>
</svg>
