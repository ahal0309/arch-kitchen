<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" width="100%" height="100%">
  <defs>
    <!-- Rich Architectural Gold Gradients with smooth metallic highlights -->
    <linearGradient id="akGoldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcdb6f" />
      <stop offset="50%" stop-color="#f5c238" />
      <stop offset="100%" stop-color="#dfa41f" />
    </linearGradient>

    <!-- Crisp Letterpress Serif Gold Gradient for high contrast & legibility -->
    <linearGradient id="akTextGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a838" />
      <stop offset="50%" stop-color="#b88a22" />
      <stop offset="100%" stop-color="#9d7314" />
    </linearGradient>

    <!-- Architectural Axis Line -->
    <linearGradient id="akAxisGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8b5af" stop-opacity="0.3" />
      <stop offset="15%" stop-color="#8a867f" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6e6b65" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#8a867f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b8b5af" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Central Hairline Divider Axis -->
  <line x1="201.5" y1="6" x2="201.5" y2="216" stroke="url(#akAxisGradient)" stroke-width="1.4" stroke-linecap="round" />

  <!-- ==================== 'A' MONOGRAM ==================== -->
  <!-- A: Upper Peak with inner triangular apex cut -->
  <polygon
    points="81,36 106,36 127,79 103,79 93.5,55 84,79 60,79"
    fill="url(#akGoldGradient)"
  />

  <!-- A: Lower Broad Architectural Foundation Arch -->
  <polygon
    points="34,130 155,130 179,184 154,184 135,144 53,144 36,184 11,184"
    fill="url(#akGoldGradient)"
  />

  <!-- ==================== 'K' MONOGRAM ==================== -->
  <!-- K: Upper Vertical Stem -->
  <rect x="241" y="36" width="23.5" height="43" fill="url(#akGoldGradient)" />

  <!-- K: Upper Diagonal Branch -->
  <polygon points="354,36 385,36 332,79 301,79" fill="url(#akGoldGradient)" />

  <!-- K: Lower Vertical Stem with Authentic Classical Spur -->
  <polygon
    points="241,130 264.5,130 270,127 270,131 264.5,134 264.5,184 241,184"
    fill="url(#akGoldGradient)"
  />

  <!-- K: Lower Diagonal Branch -->
  <polygon points="314,130 345,130 388,184 357,184" fill="url(#akGoldGradient)" />

  <!-- ==================== BRAND TYPOGRAPHY ==================== -->
  <!-- Middle Brand Name: ARCH KITCHENS (Enhanced for clear readability) -->
  <g transform="translate(201.5, 105)">
    <!-- ARCH on the left of the axis line -->
    <text
      x="-8"
      y="0"
      text-anchor="end"
      font-family="'Cinzel', 'Times New Roman', 'Cormorant Garamond', Georgia, serif"
      font-size="21.5"
      font-weight="700"
      letter-spacing="5.5"
      fill="url(#akTextGold)"
    >ARCH</text>

    <!-- KITCHENS on the right of the axis line -->
    <text
      x="12"
      y="0"
      text-anchor="start"
      font-family="'Cinzel', 'Times New Roman', 'Cormorant Garamond', Georgia, serif"
      font-size="21.5"
      font-weight="700"
      letter-spacing="5.5"
      fill="url(#akTextGold)"
    >KITCHENS</text>
  </g>

  <!-- Tagline: DESIGN YOUR DESIRE (Crisp, dark architectural charcoal tone for 100% effortless readability) -->
  <text
    x="201.5"
    y="226"
    text-anchor="middle"
    font-family="'Cinzel', 'Times New Roman', 'Cormorant Garamond', Georgia, serif"
    font-size="12"
    font-weight="700"
    letter-spacing="7.5"
    fill="#3a3834"
  >DESIGN YOUR DESIRE</text>
</svg>
